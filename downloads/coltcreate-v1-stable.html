<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColtCreate v1.0.0 — ColtApps Creative & Productivity Suite | Muir Middle School (HVS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --muir-navy: #0f294a;
      --muir-navy-deep: #091a30;
      --muir-gold: #eab308;
      --muir-gold-hover: #ca8a04;
      --bg-base: #f1f5f9;
      --bg-surface: #ffffff;
      --bg-elevated: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-1px: #cbd5e1;
    }

    html.dark {
      --bg-base: #060d17;
      --bg-surface: #0b1626;
      --bg-elevated: #11223a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-1px: #1e3a5f;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
    }

    .cc-surface {
      background-color: var(--bg-surface);
      border-color: var(--border-1px);
    }

    .cc-elevated {
      background-color: var(--bg-elevated);
      border-color: var(--border-1px);
    }

    .cc-border {
      border-color: var(--border-1px);
    }

    .cc-muted {
      color: var(--text-muted);
    }

    /* Rich Document Editor styling */
    #writer-canvas:focus {
      outline: none;
    }
    #writer-canvas h1 {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }
    #writer-canvas h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-top: 0.75rem;
      margin-bottom: 0.35rem;
    }
    #writer-canvas p {
      margin-bottom: 0.6rem;
      line-height: 1.65;
    }
    #writer-canvas ul {
      list-style-type: disc;
      padding-left: 1.5rem;
      margin-bottom: 0.6rem;
    }
    #writer-canvas ol {
      list-style-type: decimal;
      padding-left: 1.5rem;
      margin-bottom: 0.6rem;
    }
    #writer-canvas table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.75rem 0;
    }
    #writer-canvas td, #writer-canvas th {
      border: 1px solid #94a3b8;
      padding: 0.45rem 0.6rem;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.3); border-radius: 999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.5); }

    @media print {
      body * { visibility: hidden; }
      #writer-canvas, #writer-canvas * { visibility: visible; }
      #writer-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        box-shadow: none !important;
        border: none !important;
        padding: 1in !important;
        background: #ffffff !important;
        color: #000000 !important;
      }
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col font-sans select-none">

  <!-- TOP WORKSPACE HEADER -->
  <header class="bg-[#0f294a] text-white border-b border-amber-500/30 px-3 py-2 flex flex-wrap items-center justify-between gap-2 z-30 flex-shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-[#eab308] text-[#091a30] font-black flex items-center justify-center shadow">
        C3
      </div>
      <div>
        <div class="flex items-center gap-2">
          <span class="font-extrabold text-sm tracking-tight">ColtCreate</span>
          <span class="px-1.5 py-0.5 text-[10px] font-mono font-bold rounded bg-[#eab308] text-[#091a30]">v1.0.0</span>

            ColtApps &bull; Built for Muir Middle School (HVS) by Henry Green

        <span class="hidden sm:inline">Save Now</span>

      <button id="btn-dark-toggle" class="px-2.5 py-1.5 rounded-lg bg-[#eab308] hover:bg-amber-400 text-[#091a30] text-xs font-extrabold flex items-center gap-1.5 transition">

  <!-- MAIN WORKSPACE BODY -->

    <!-- LEFT APP LAUNCHER RAIL (Responsive: Horizontal bar on mobile, Vertical rail on desktop) -->
    <nav id="app-rail" class="bg-[#091a30] text-slate-200 border-b md:border-b-0 md:border-r border-[#1e3a5f] flex md:flex-col items-center justify-between md:justify-start gap-1 p-1.5 md:w-20 flex-shrink-0 overflow-x-auto z-20">
      <!-- App buttons populated via JS -->
    </nav>

    <!-- ACTIVE APP WORKSPACE VIEWPORT -->
    <main id="app-viewport" class="flex-1 overflow-hidden flex flex-col relative">
      <!-- App views rendered dynamically -->
    </main>

  </div>

  <!-- FULLSCREEN PRESENTATION OVERLAY (FOR COLTSLIDES) -->
  <div id="present-overlay" class="hidden fixed inset-0 z-50 bg-black flex flex-col">
    <div id="present-stage" class="flex-1 flex items-center justify-center p-6 sm:p-12"></div>
    <div class="bg-zinc-950/90 border-t border-white/10 px-4 py-2.5 flex items-center justify-between text-white font-mono text-xs">
      <div id="present-counter">Slide 1 / 1</div>
      <div class="flex items-center gap-2">
        <button id="present-prev" class="px-3 py-1.5 rounded-lg bg-white/10 hover:bg-white/20 font-bold">&larr; Prev</button>
        <button id="present-next" class="px-3 py-1.5 rounded-lg bg-[#eab308] text-[#091a30] font-extrabold">Next &rarr;</button>
        <button id="present-exit" class="px-3 py-1.5 rounded-lg bg-rose-600 hover:bg-rose-500 font-bold ml-2">Exit (Esc)</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="cc-toast" class="hidden fixed bottom-4 right-4 z-50 bg-[#0f294a] text-white border border-[#eab308] px-4 py-2 rounded-xl shadow-2xl text-xs font-mono font-bold">

  <script>

<h2>Key Benefits of ColtApps</h2>
<ul>

  <li>Unified creative tools covering documents, spreadsheets, slides, art, and video.</li>
  <li>Built specifically for the Muir Colts learning community.</li>
</ul>`
        },
        slides: {
          title: 'Muir_Science_Fair_2026.slides',
          theme: 'muir', // 'muir' | 'cyber' | 'academic' | 'emerald'
          activeIndex: 0,
          items: [
            {
              layout: 'title',

        },
        sheets: {
          title: 'Q2_Grade_Calculator.sheet',
          selectedCell: 'A1',
          chartCol: 'C',
          cells: {
            A1: { raw: 'Subject', bold: true, fmt: 'text' },
            B1: { raw: 'Assignments', bold: true, fmt: 'text' },

          color: '#eab308',
          size: 6,
          dataUrl: null
        },
        forms: {
          subTab: 'forms', // 'forms' | 'notes'
          formTitle: 'Muir Middle School Coding & Robotics Club Sign-Up',
          questions: [
            { id: 'q1', type: 'mc', prompt: 'Which grade are you in at Muir Middle School?', options: ['6th Grade', '7th Grade', '8th Grade'] },
            { id: 'q2', type: 'mc', prompt: 'Which ColtApps project are you most excited to try?', options: ['ColtCreate Office', 'ColtBrowser DEV', 'ColtEmulate Hypervisor'] },
            { id: 'q3', type: 'rating', prompt: 'How confident are you with HTML/JS coding? (1-5)', options: ['1', '2', '3', '4', '5'] }
          ],
          responses: [
            { q1: '8th Grade', q2: 'ColtCreate Office', q3: '5' },
            { q1: '7th Grade', q2: 'ColtEmulate Hypervisor', q3: '4' },
            { q1: '8th Grade', q2: 'ColtBrowser DEV', q3: '5' }
          ],
          stickies: [
            { id: 's1', color: 'bg-amber-200 text-slate-900', title: 'Science Lab Due', body: 'Finish solar angle data table in ColtSheets before Friday!' },
            { id: 's2', color: 'bg-sky-200 text-slate-900', title: 'ELA Essay Checklist', body: 'Check thesis statement and export PDF from ColtWriter.' },
            { id: 's3', color: 'bg-emerald-200 text-slate-900', title: 'ColtApps Release', body: 'ColtCreate v1.0.0 ready for HVS Google Sites!' }
          ]
        }
      };

      let state = JSON.parse(JSON.stringify(defaultState));

      // --- Storage Helpers ---
      function loadWorkspace() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          state = {
            ...state,
            ...parsed,
            writer: { ...state.writer, ...(parsed.writer || {}) },
            slides: { ...state.slides, ...(parsed.slides || {}) },
            sheets: { ...state.sheets, ...(parsed.sheets || {}) },
            studio: { ...state.studio, ...(parsed.studio || {}), playing: false },
            paint: { ...state.paint, ...(parsed.paint || {}) },
            forms: { ...state.forms, ...(parsed.forms || {}) }
          };
        } catch (e) {}
      }

      function saveWorkspace(showNotification = false) {
        try {
          const toSave = {
            darkMode: state.darkMode,
            activeApp: state.activeApp,
            recentFiles: state.recentFiles,
            writer: state.writer,
            slides: state.slides,
            sheets: state.sheets,
            studio: { ...state.studio, playing: false },
            paint: state.paint,
            forms: state.forms
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
          const st = document.getElementById('header-doc-status');
          if (st) {
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            st.textContent = `ColtHub Cloud Drive • Saved at ${time}`;
          }
          if (showNotification) toast('Workspace saved to local storage');
        } catch (e) {}
      }

      let toastTimer = null;
      function toast(msg) {
        const el = document.getElementById('cc-toast');
        el.textContent = msg;
        el.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.add('hidden'), 2200);
      }

      function esc(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function downloadBlob(content, filename, mime = 'text/plain') {
        const blob = new Blob([content], { type: mime });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = filename;
        a.click();
        toast(`Downloaded ${filename}`);
      }

      function applyTheme() {
        document.documentElement.classList.toggle('dark', !!state.darkMode);
        document.getElementById('dark-icon').textContent = state.darkMode ? '☀️' : '🌙';
        document.getElementById('dark-label').textContent = state.darkMode ? 'Light Mode' : 'Dark Mode';
      }

      // --- Render Left App Launcher Rail ---
      function renderRail() {
        const rail = document.getElementById('app-rail');
        rail.innerHTML = APPS.map(app => {
          const active = state.activeApp === app.id;
          return `
            <button
              data-switch-app="${app.id}"
              class="flex flex-col items-center justify-center p-2 rounded-xl transition flex-shrink-0 w-16 md:w-full ${
                active
                  ? 'bg-[#eab308] text-[#091a30] font-extrabold shadow-md'
                  : 'text-slate-300 hover:bg-white/10'
              }"
            >
              <span class="text-lg leading-none mb-1">${app.icon}</span>
              <span class="text-[10px] font-bold tracking-tight leading-tight">${app.name}</span>
            </button>
          `;
        }).join('');

        rail.querySelectorAll('[data-switch-app]').forEach(btn => {
          btn.addEventListener('click', () => {
            stopStudioPlayback();
            state.activeApp = btn.getAttribute('data-switch-app');
            saveWorkspace(false);
            renderRail();
            renderActiveApp();
          });
        });
      }

      // =========================================================================
      // 1. COLTHUB (HOME, TEMPLATES & CLOUD DRIVE)
      // =========================================================================
      function renderHub() {
        return `
          <div class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6">
            <!-- Hero Banner -->
            <div class="rounded-2xl bg-gradient-to-r from-[#0f294a] via-[#163a68] to-[#0f294a] text-white p-5 sm:p-6 border border-amber-400/30 shadow-lg flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div class="space-y-1.5">
                <div class="inline-flex items-center gap-2 px-2.5 py-0.5 rounded-full bg-[#eab308] text-[#091a30] font-mono text-[11px] font-extrabold">
                  COLTAPPS PRODUCTIVITY &amp; CREATIVE SUITE
                </div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">Welcome to ColtCreate, Muir Student!</h1>
                <p class="text-xs sm:text-sm text-sky-100/90 max-w-2xl">
                  Create documents, presentations, spreadsheets, videos, digital art, and classroom forms—100% browser-based and built for Muir Middle School (HVS) by Henry Green.
                </p>
              </div>
              <div class="flex flex-wrap gap-2 flex-shrink-0">
                <button id="hub-backup-btn" class="px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-bold border border-white/20">
                  Export Backup (.json)
                </button>
                <label class="px-3.5 py-2 rounded-xl bg-[#eab308] hover:bg-amber-400 text-[#091a30] text-xs font-extrabold cursor-pointer">
                  Restore Backup
                  <input id="hub-restore-input" type="file" accept=".json" class="hidden" />
                </label>
              </div>
            </div>

            <!-- Quick Launch Apps Grid -->
            <div>
              <h2 class="text-xs font-mono font-bold uppercase tracking-wider cc-muted mb-3">Launch a ColtCreate Application</h2>
              <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
                ${APPS.filter(a => a.id !== 'hub').map(app => `
                  <button data-hub-open="${app.id}" class="cc-surface border rounded-2xl p-4 text-left hover:border-amber-400 hover:shadow-md transition flex flex-col justify-between gap-3">
                    <div class="w-10 h-10 rounded-xl ${app.badge} flex items-center justify-center text-xl shadow-sm">
                      ${app.icon}
                    </div>
                    <div>
                      <div class="font-extrabold text-sm">${app.name}</div>
                      <div class="text-[11px] cc-muted">${app.sub}</div>
                    </div>
                  </button>
                `).join('')}
              </div>
            </div>

            <!-- HVS Starter Templates -->

            renderRail();

        const s = state.slides;

        const stage = document.getElementById('present-stage');
        stage.innerHTML = `<div class="w-full max-w-5xl aspect-video">${renderSlideStageHtml(slide, s.theme, false)}</div>`;

      // =========================================================================
      // 4. COLTSHEETS (EXCEL EQUIVALENT — FORMULA SPREADSHEET & CHART)
      // =========================================================================
      const COLS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H'];
      const ROWS = 16;

      function colToIdx(c) { return COLS.indexOf(c.toUpperCase()); }
      function parseRef(ref) {
        const m = /^([A-H])(\d+)$/i.exec(ref.trim());
        if (!m) return null;
        return { col: colToIdx(m[1]), row: Number(m[2]) };
      }

      function evalCell(cellId, visited = new Set()) {
        if (visited.has(cellId)) return '#REF!';
        visited.add(cellId);
        const cell = state.sheets.cells[cellId];
        if (!cell || cell.raw === '') return '';
        const raw = String(cell.raw).trim();
        if (!raw.startsWith('=')) return raw;

        const expr = raw.slice(1).trim();
        try {
          // Range functions: SUM, AVERAGE, MIN, MAX, COUNT
          const fnMatch = /^(SUM|AVERAGE|MIN|MAX|COUNT)\(([A-H]\d+):([A-H]\d+)\)$/i.exec(expr);
          if (fnMatch) {
            const fn = fnMatch[1].toUpperCase();
            const p1 = parseRef(fnMatch[2]);
            const p2 = parseRef(fnMatch[3]);
            if (!p1 || !p2) return '#ERR';
            const nums = [];
            for (let r = Math.min(p1.row, p2.row); r <= Math.max(p1.row, p2.row); r++) {
              for (let c = Math.min(p1.col, p2.col); c <= Math.max(p1.col, p2.col); c++) {
                const v = Number(evalCell(`${COLS[c]}${r}`, new Set(visited)));
                if (!isNaN(v) && evalCell(`${COLS[c]}${r}`) !== '') nums.push(v);
              }
            }
            if (fn === 'COUNT') return nums.length;
            if (nums.length === 0) return 0;
            const sum = nums.reduce((a, b) => a + b, 0);
            if (fn === 'SUM') return Math.round(sum * 100) / 100;
            if (fn === 'AVERAGE') return Math.round((sum / nums.length) * 100) / 100;
            if (fn === 'MIN') return Math.min(...nums);
            if (fn === 'MAX') return Math.max(...nums);
          }

          // Arithmetic with cell references (e.g., =C2+D2 or =B2*10)
          const substituted = expr.replace(/\b([A-H]\d+)\b/gi, (_, ref) => {
            const val = Number(evalCell(ref.toUpperCase(), new Set(visited)));
            return isNaN(val) ? 0 : val;
          });
          if (/[^0-9+\-*/().\s]/.test(substituted)) return '#ERR';
          const result = Function(`"use strict"; return (${substituted})`)();
          return typeof result === 'number' && isFinite(result) ? Math.round(result * 100) / 100 : '#ERR';
        } catch (e) {
          return '#ERR';
        }
      }

      let studioInterval = null;

      function stopStudioPlayback() {
        if (studioInterval) clearInterval(studioInterval);

      function playSynthChime(step) {
        if (!state.studio.audioEnabled) return;
        try {
          if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const notes = [261.63, 329.63, 392.0, 523.25];
          osc.type = 'triangle';
          osc.frequency.value = notes[step % notes.length];
          gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.19);
        } catch (e) {}
      }

      function drawStudioFrame() {
        const canvas = document.getElementById('studio-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const st = state.studio;
        const total = st.clips.length || 1;
        const exactPos = (st.playhead / 100) * total;
        const clipIdx = Math.min(total - 1, Math.floor(exactPos));
        const localProgress = exactPos - clipIdx;
        const clip = st.clips[clipIdx];

        // Background fill
        ctx.fillStyle = clip.bg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Decorative accent bars
        ctx.fillStyle = clip.accent;
        ctx.fillRect(0, 0, canvas.width, 8);
        ctx.fillRect(0, canvas.height - 8, canvas.width, 8);

        // Kinetic slide-in animation
        const slideOffset = Math.max(0, (1 - Math.min(1, localProgress * 3)) * 40);

        // Sticker Emoji
        ctx.font = '48px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(clip.sticker, canvas.width / 2, 95 + slideOffset * 0.5);

        // Headline
        ctx.fillStyle = '#ffffff';
        ctx.font = '900 28px Inter, sans-serif';
        ctx.fillText(clip.headline, canvas.width / 2, 155 + slideOffset);

        // Subtitle
        ctx.fillStyle = clip.accent;
        ctx.font = '600 15px Inter, sans-serif';
        ctx.fillText(clip.sub, canvas.width / 2, 188 + slideOffset);

        // Watermark
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '11px monospace';
        ctx.fillText(`ColtStudio • Scene ${clipIdx + 1}/${total} • ${Math.round(st.playhead)}%`, canvas.width / 2, canvas.height - 20);
      }

      let paintHistory = [];
      let paintRedo = [];

      function renderPaint() {

      function drawPosterBase(ctx, w, h) {
        ctx.fillStyle = '#0f294a';
        ctx.fillRect(0, 0, w, h);
        ctx.strokeStyle = '#eab308';
        ctx.lineWidth = 8;
        ctx.strokeRect(18, 18, w - 36, h - 36);
        ctx.fillStyle = '#eab308';
        ctx.font = '900 34px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GO MUIR COLTS!', w / 2, 85);
        ctx.fillStyle = '#ffffff';
        ctx.font = '600 16px Inter, sans-serif';
        ctx.fillText('Draw your school spirit poster below using ColtPaint', w / 2, 120);
      }

      function bindPaint() {
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d');
        const p = state.paint;

        if (p.dataUrl) {
          const img = new Image();
          img.onload = () => ctx.drawImage(img, 0, 0);
          img.src = p.dataUrl;
        } else {
          drawPosterBase(ctx, canvas.width, canvas.height);
          p.dataUrl = canvas.toDataURL();
        }

        function pushHistory() {
          paintHistory.push(canvas.toDataURL());
          if (paintHistory.length > 20) paintHistory.shift();
          paintRedo = [];
        }

        let drawing = false;
        let startX = 0;
        let startY = 0;
        let snapshot = null;

        function getPos(e) {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return {
            x: ((clientX - rect.left) / rect.width) * canvas.width,
            y: ((clientY - rect.top) / rect.height) * canvas.height
          };
        }

        function onDown(e) {
          e.preventDefault();
          pushHistory();
          const pos = getPos(e);
          startX = pos.x;
          startY = pos.y;

          if (p.tool === 'text') {
            ctx.fillStyle = p.color;
            ctx.font = `900 ${Math.max(18, p.size * 3)}px Inter, sans-serif`;
            ctx.textAlign = 'center';
            ctx.fillText('★ COLTS ★', startX, startY);
            p.dataUrl = canvas.toDataURL();
            saveWorkspace(false);
            return;
          }

          drawing = true;
          snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
          ctx.beginPath();
          ctx.moveTo(startX, startY);
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.lineWidth = p.size;
          ctx.strokeStyle = p.tool === 'eraser' ? '#ffffff' : p.color;
        }

        function onMove(e) {
          if (!drawing) return;
          e.preventDefault();
          const pos = getPos(e);
          if (p.tool === 'brush' || p.tool === 'eraser') {
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
          } else {
            ctx.putImageData(snapshot, 0, 0);
            ctx.beginPath();
            ctx.strokeStyle = p.color;
            ctx.lineWidth = p.size;
            if (p.tool === 'line') {
              ctx.moveTo(startX, startY);
              ctx.lineTo(pos.x, pos.y);
            } else if (p.tool === 'rect') {
              ctx.strokeRect(startX, startY, pos.x - startX, pos.y - startY);
            } else if (p.tool === 'circle') {
              const r = Math.hypot(pos.x - startX, pos.y - startY);
              ctx.arc(startX, startY, r, 0, Math.PI * 2);
            }
            ctx.stroke();
          }
        }

        function onUp() {
          if (!drawing) return;
          drawing = false;
          p.dataUrl = canvas.toDataURL();
          saveWorkspace(false);
        }

        canvas.addEventListener('mousedown', onDown);
        canvas.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        canvas.addEventListener('touchstart', onDown, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onUp);

        document.querySelectorAll('[data-pt-tool]').forEach(btn => {
          btn.addEventListener('click', () => {
            p.tool = btn.getAttribute('data-pt-tool');
            renderActiveApp();
          });
        });

        document.querySelectorAll('[data-pt-color]').forEach(btn => {
          btn.addEventListener('click', () => {
            p.color = btn.getAttribute('data-pt-color');
            renderActiveApp();
          });
        });

        document.getElementById('pt-color-picker').addEventListener('input', (e) => {
          p.color = e.target.value;
        });

        document.getElementById('pt-size').addEventListener('input', (e) => {
          p.size = Number(e.target.value);
        });

        document.getElementById('pt-undo').addEventListener('click', () => {
          if (!paintHistory.length) return;
          const prev = paintHistory.pop();
          const img = new Image();
          img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
            p.dataUrl = canvas.toDataURL();
            saveWorkspace(false);
          };
          img.src = prev;
        });

        document.getElementById('pt-clear').addEventListener('click', () => {
          pushHistory();
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          p.dataUrl = canvas.toDataURL();
          saveWorkspace(false);
        });

        document.getElementById('pt-download').addEventListener('click', () => {
          const a = document.createElement('a');
          a.href = canvas.toDataURL('image/png');
          a.download = 'ColtPaint_Artwork.png';
          a.click();
          toast('Downloaded ColtPaint_Artwork.png');
        });
      }

      // =========================================================================
      // 7. COLTFORMS & COLTNOTES (FORMS + STICKY NOTES MICRO-SUITE)
      // =========================================================================
      function renderFormsAndNotes() {
        const f = state.forms;
        return `
          <div class="flex-1 flex flex-col overflow-hidden text-xs">
            <!-- Sub-Tab Header -->
            <div class="cc-surface border-b px-4 py-2 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <button data-fn-tab="forms" class="px-3 py-1.5 rounded-lg font-bold ${f.subTab === 'forms' ? 'bg-[#0f294a] text-amber-300' : 'cc-elevated border'}">
                  📋 ColtForms (Quizzes &amp; Polls)
                </button>
                <button data-fn-tab="notes" class="px-3 py-1.5 rounded-lg font-bold ${f.subTab === 'notes' ? 'bg-[#0f294a] text-amber-300' : 'cc-elevated border'}">
                  🗒️ ColtNotes (Sticky Board)
                </button>
              </div>
              ${f.subTab === 'notes' ? `<button id="fn-add-sticky" class="px-3 py-1.5 rounded-lg bg-[#eab308] text-[#091a30] font-extrabold">+ Add Sticky Note</button>` : ''}
            </div>

            ${f.subTab === 'forms' ? `
              <div class="flex-1 overflow-y-auto p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Live Form Preview & Submission -->
                <form id="cf-submit-form" class="cc-surface border rounded-2xl p-5 space-y-4 shadow-sm">
                  <div class="border-t-8 border-[#0f294a] -mx-5 -mt-5 px-5 pt-4 pb-3 border-b cc-border">
                    <input id="cf-title-inp" type="text" value="${esc(f.formTitle)}" class="w-full text-base font-extrabold bg-transparent focus:outline-none" />
                    <div class="text-[11px] cc-muted mt-0.5">Muir Middle School (HVS) &bull; Submit a response below</div>
                  </div>
                  ${f.questions.map(q => `
                    <div class="space-y-1.5">
                      <div class="font-bold">${esc(q.prompt)}</div>
                      <div class="space-y-1">
                        ${q.options.map((opt, idx) => `
                          <label class="flex items-center gap-2 p-2 rounded-lg cc-elevated border cursor-pointer hover:border-amber-400">
                            <input type="radio" name="${q.id}" value="${esc(opt)}" ${idx === 0 ? 'checked' : ''} class="accent-amber-500" />
                            <span>${esc(opt)}</span>
                          </label>
                        `).join('')}
                      </div>
                    </div>
                  `).join('')}
                  <button type="submit" class="w-full py-2.5 rounded-xl bg-[#0f294a] hover:bg-[#173c6b] text-amber-300 font-extrabold">
                    Submit Response
                  </button>
                </form>

                <!-- Instant Analytics Results -->
                <div class="cc-surface border rounded-2xl p-5 space-y-4">
                  <div class="flex items-center justify-between border-b cc-border pb-2.5">
                    <span class="font-extrabold text-sm">Live Response Summary</span>
                    <span class="px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 font-mono font-bold">
                      ${f.responses.length} Responses
                    </span>
                  </div>
                  ${f.questions.map(q => {
                    const total = Math.max(1, f.responses.length);
                    return `
                      <div class="space-y-1.5">
                        <div class="font-bold text-xs">${esc(q.prompt)}</div>
                        ${q.options.map(opt => {
                          const count = f.responses.filter(r => r[q.id] === opt).length;
                          const pct = Math.round((count / total) * 100);
                          return `
                            <div>
                              <div class="flex justify-between text-[11px] font-mono mb-0.5">
                                <span>${esc(opt)}</span>
                                <span>${count} (${pct}%)</span>
                              </div>
                              <div class="w-full h-2.5 rounded-full bg-slate-200 dark:bg-slate-800 overflow-hidden">
                                <div class="h-full bg-[#eab308]" style="width: ${pct}%"></div>
                              </div>
                            </div>
                          `;
                        }).join('')}
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            ` : `
              <!-- Sticky Notes Grid -->
              <div class="flex-1 overflow-y-auto p-4 sm:p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 content-start">
                ${f.stickies.map((st, idx) => `
                  <div class="${st.color} rounded-2xl p-4 shadow-md flex flex-col justify-between gap-2 min-h-[170px]">
                    <div class="flex items-center justify-between gap-2 border-b border-black/10 pb-1.5">
                      <input data-st-title="${idx}" type="text" value="${esc(st.title)}" class="font-extrabold text-sm bg-transparent focus:outline-none w-full" />
                      <button data-st-del="${idx}" class="font-bold opacity-60 hover:opacity-100">&times;</button>
                    </div>
                    <textarea data-st-body="${idx}" class="flex-1 bg-transparent text-xs leading-relaxed resize-none focus:outline-none">${esc(st.body)}</textarea>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        `;
      }

      function bindFormsAndNotes() {
        const f = state.forms;
        document.querySelectorAll('[data-fn-tab]').forEach(btn => {
          btn.addEventListener('click', () => {
            f.subTab = btn.getAttribute('data-fn-tab');
            renderActiveApp();
          });
        });

        const form = document.getElementById('cf-submit-form');
        if (form) {
          document.getElementById('cf-title-inp').addEventListener('input', (e) => {
            f.formTitle = e.target.value;
            saveWorkspace(false);
          });
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const fd = new FormData(form);
            const entry = {};
            f.questions.forEach(q => { entry[q.id] = fd.get(q.id) || q.options[0]; });
            f.responses.push(entry);
            saveWorkspace(false);
            renderActiveApp();
            toast('Form response recorded!');
          });
        }

        const addStickyBtn = document.getElementById('fn-add-sticky');
        if (addStickyBtn) {
          addStickyBtn.addEventListener('click', () => {
            const colors = ['bg-amber-200 text-slate-900', 'bg-sky-200 text-slate-900', 'bg-emerald-200 text-slate-900', 'bg-pink-200 text-slate-900'];
            f.stickies.unshift({
              id: 's' + Date.now(),
              color: colors[f.stickies.length % colors.length],
              title: 'Quick Class Note',
              body: 'Type your Muir Middle School study reminder here...'
            });
            saveWorkspace(false);
            renderActiveApp();
          });
        }

        document.querySelectorAll('[data-st-title]').forEach(inp => {
          inp.addEventListener('input', (e) => {
            f.stickies[Number(inp.getAttribute('data-st-title'))].title = e.target.value;
            saveWorkspace(false);
          });
        });
        document.querySelectorAll('[data-st-body]').forEach(ta => {
          ta.addEventListener('input', (e) => {
            f.stickies[Number(ta.getAttribute('data-st-body'))].body = e.target.value;
            saveWorkspace(false);
          });
        });
        document.querySelectorAll('[data-st-del]').forEach(btn => {
          btn.addEventListener('click', () => {
            f.stickies.splice(Number(btn.getAttribute('data-st-del')), 1);
            saveWorkspace(false);
            renderActiveApp();
          });
        });
      }

      // --- Render Active App Router ---
      function renderActiveApp() {
        const vp = document.getElementById('app-viewport');
        const app = state.activeApp;
        if (app === 'hub') { vp.innerHTML = renderHub(); bindHub(); }
        else if (app === 'writer') { vp.innerHTML = renderWriter(); bindWriter(); }
        else if (app === 'slides') { vp.innerHTML = renderSlides(); bindSlides(); }
        else if (app === 'sheets') { vp.innerHTML = renderSheets(); bindSheets(); }
        else if (app === 'studio') { vp.innerHTML = renderStudio(); bindStudio(); }
        else if (app === 'paint')  { vp.innerHTML = renderPaint();  bindPaint(); }
        else if (app === 'forms')  { vp.innerHTML = renderFormsAndNotes(); bindFormsAndNotes(); }
      }

      // --- Global Header & Presentation Controls ---
      function bindGlobal() {
        document.getElementById('btn-dark-toggle').addEventListener('click', () => {
          state.darkMode = !state.darkMode;
          applyTheme();
          saveWorkspace(false);
        });

        document.getElementById('btn-quick-save').addEventListener('click', () => saveWorkspace(true));

        document.getElementById('present-prev').addEventListener('click', () => {
          presentIdx = Math.max(0, presentIdx - 1);
          renderPresentFrame();
        });
        document.getElementById('present-next').addEventListener('click', () => {
          presentIdx = Math.min(state.slides.items.length - 1, presentIdx + 1);
          renderPresentFrame();
        });
        document.getElementById('present-exit').addEventListener('click', () => {
          document.getElementById('present-overlay').classList.add('hidden');
        });

        window.addEventListener('keydown', (e) => {
          const overlay = document.getElementById('present-overlay');
          if (overlay.classList.contains('hidden')) return;
          if (e.key === 'Escape') overlay.classList.add('hidden');
          if (e.key === 'ArrowRight' || e.key === ' ') {
            presentIdx = Math.min(state.slides.items.length - 1, presentIdx + 1);
            renderPresentFrame();
          }
          if (e.key === 'ArrowLeft') {
            presentIdx = Math.max(0, presentIdx - 1);
            renderPresentFrame();
          }
        });
      }

      // --- Boot ColtCreate ---
      loadWorkspace();
      applyTheme();
      bindGlobal();
      renderRail();
      renderActiveApp();
    })();
  </script>
</body>
</html>
